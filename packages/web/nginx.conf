# Serves the built SPA (see Dockerfile.web). TLS is handled by the proxy in
# front (Coolify's Traefik), so this listens on plain HTTP.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Vite fingerprints these files, so a new build always gets new names:
  # browsers may keep them forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Every other path is a client-side route: serve the app shell, never cached,
  # so a deploy reaches users on their next page load.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ /index.html;
  }
}
