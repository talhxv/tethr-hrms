# Local infrastructure for development. Started by scripts/setup-dev.sh.
# Not used in CI (CI provides its own service containers).
services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms
    ports:
      - '5432:5432'
    volumes:
      - hrms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms -d hrms']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: hrms-redis
    ports:
      - '6379:6379'
    volumes:
      - hrms_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hrms_pgdata:
  hrms_redisdata:
